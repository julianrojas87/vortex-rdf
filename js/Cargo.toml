[package]
name = "vortex-rdf"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
# This crate is built with wasm-pack and published to npm, not crates.io.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-opt's default `-O` costs many minutes on this module and buys nothing we
# want: LLVM at opt-level=3 has already done the real optimization, so `-O` only
# shrinks the file. -O1 builds ~20x faster, gzips comparably (what npm and CDNs
# actually ship), and is indistinguishable at runtime.
#
# Size history (raw / gzip after -O1): 12.22MB / 2.46MB on the 0.83 vortex tree
# with the IPC byte format; 24.5MB / 4.7MB after the embedded-store format made
# `toBytes`/`fromBytes` real Vortex files — the file writer's compression
# pipeline (btrblocks + every registered encoding) is now reachable from wasm
# and can no longer be dead-stripped. If the bundle ever matters more than
# writer parity, a wasm-only lighter write strategy is the lever.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O1']

[dependencies]
vortex-rdf-core = { path = "../core", default-features = false }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4.76"
js-sys.workspace = true
futures.workspace = true
console_error_panic_hook.workspace = true
getrandom = { version = "0.3.4", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4.3", features = ["wasm_js"] }
oxrdf.workspace = true
oxrdfio.workspace = true
vortex-array.workspace = true
vortex.workspace = true

[dependencies.web-sys]
version = "0.3.103"
features = ["console"]
