name: CodSpeed Benchmarks

on:
  push:
    branches:
      - "main"
    # Doc-only changes move no instruction counts; workflow_dispatch stays as
    # the escape hatch since path filters never apply to it.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions: # optional for public repositories
 contents: read # required for actions/checkout
 id-token: write # required for OIDC authentication with CodSpeed
  
jobs:
  benchmarks:
    name: Run Rust benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed

      - name: Build the benchmark target(s)
        run: cargo codspeed build

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: cargo codspeed run --bench benchmark
        env:
          DIVAN_SAMPLE_COUNT: 10

  js-benchmarks:
    name: Run JS benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # wasm-pack (invoked by `npm run build`) needs a Rust toolchain with the
      # wasm target; the bindings are compiled fresh so the bench measures HEAD.
      - name: Setup Rust toolchain (for wasm-pack)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install deps and build the wasm bindings
        working-directory: js
        run: |
          npm ci
          npm run build

      # Same CodSpeed project and mode as the Rust job (simulation = instruction
      # counting), so the JS bindings' tasks publish with flamegraphs next to the
      # Rust benchmarks. Invoke node with the tsx loader directly (not `npx tsx`)
      # so there is no extra process layer between the CodSpeed runner and the
      # benchmark.
      - name: Run the JS benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: node --import tsx --expose-gc bench/codspeed.bench.ts
          working-directory: js