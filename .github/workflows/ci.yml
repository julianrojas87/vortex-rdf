name: CI

on:
  push:
    branches:
      - main
    # Doc-only changes can't break the build. Repeated per event because path
    # filters are not inherited across triggers (and Actions does not support
    # YAML anchors).
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  # Lets the release workflow run the full CI suite against the exact ref
  # being published before anything reaches a registry.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The no-default-features build has its own dead-code surface (items only
      # reachable through the file-io feature), which the default clippy run
      # cannot see.
      - name: Run clippy (core, no default features)
        run: cargo clippy -p vortex-rdf-core --no-default-features --all-targets -- -D warnings

  rust-tests:
    name: Rust Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: workspace
            command: cargo test --workspace
          - label: core-no-default-features
            command: cargo test -p vortex-rdf-core --no-default-features
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run Rust tests
        run: ${{ matrix.command }}

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # Both js and python are members of the root workspace, so maturin and
      # wasm-pack write to <root>/target; the cache covers that default path and
      # `key` keeps each job's entry separate.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: python
      - name: Build bindings and install environment
        working-directory: python
        run: uv sync --locked
      - name: Run tests
        working-directory: python
        run: uv run pytest tests -q

  js-tests:
    name: JS Tests
    runs-on: ubuntu-latest
    env:
      # Matches release.yml's npm job, so this job tests the codegen config
      # that actually ships. Also the standard wasm size lever.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      #
      # EXPERIMENT (branch ci/measure-wasm-build-memory): two further knobs
      # used to live here and are deliberately removed —
      #
      #   CARGO_PROFILE_RELEASE_OPT_LEVEL: "s"
      #   CARGO_BUILD_JOBS: "1"
      #
      # They were added to stop the wasm build exhausting memory, but that
      # was never measured on a runner, and opt-level is not really a memory
      # knob: it made this job validate an opt-level="s" binary while npm
      # ships opt-level=3 (release.yml sets CODEGEN_UNITS only). Dropping
      # both restores test/ship parity and lets the default 4-way fan-out
      # use the 4-vCPU runner.
      #
      # The "Build WASM package" step below reports peak RSS so this can be
      # decided on numbers. If the job OOMs or peaks near the runner's 16 GB,
      # reinstate CARGO_BUILD_JOBS (the pure memory knob, no artifact effect)
      # first — and only then opt-level, accepting the parity gap.
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # EXPERIMENT: the key is bumped off `js` on purpose. A fresh namespace
      # means the first run on this branch restores nothing and compiles the
      # whole ~900-crate wasm dependency tree — the cold path the removed env
      # vars were guarding, and the only one whose peak RSS is worth reading.
      # Cache-warm reruns are not evidence. Restore `key: js` when done.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: js-cold-probe
      # wasm-pack is a pinned npm devDependency; `npm ci` installs it and npm
      # run puts node_modules/.bin ahead of anything on PATH.
      - name: Install dependencies
        working-directory: js
        run: npm ci
      - name: Build WASM package
        working-directory: js
        shell: bash
        run: |
          # `/usr/bin/time` — the binary, not bash's `time` keyword — is what
          # reports peak RSS, and it is not on every runner image. `-o` keeps
          # the report out of the build's own output and preserves the exit
          # status, so a failed build still fails the step.
          if ! command -v /usr/bin/time >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq time
          fi
          /usr/bin/time -v -o /tmp/wasm-build-time.log npm run build
          peak_kb=$(awk '/Maximum resident set size/ {print $NF}' /tmp/wasm-build-time.log)
          wall=$(awk -F': ' '/Elapsed \(wall clock\)/ {print $2}' /tmp/wasm-build-time.log)
          wasm_kib=$(( $(stat -c%s pkg/web/vortex_rdf_bg.wasm) / 1024 ))
          echo "::notice title=wasm cold build::peak RSS $((peak_kb / 1024)) MiB (runner has 16 GiB), wall ${wall}, wasm ${wasm_kib} KiB"
          cat /tmp/wasm-build-time.log
      # Typechecks after the build: the tsconfigs resolve against the generated
      # pkg/web/vortex_rdf.d.ts.
      - name: Run typecheck
        working-directory: js
        run: npm run typecheck
      - name: Run tests
        working-directory: js
        run: npm test
