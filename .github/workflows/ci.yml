name: CI

on:
  push:
    branches:
      - main
    # Doc-only changes can't break the build. Repeated per event because path
    # filters are not inherited across triggers (and Actions does not support
    # YAML anchors).
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  # Lets the release workflow run the full CI suite against the exact ref
  # being published before anything reaches a registry.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The no-default-features build has its own dead-code surface (items only
      # reachable through the file-io feature), which the default clippy run
      # cannot see.
      - name: Run clippy (core, no default features)
        run: cargo clippy -p vortex-rdf-core --no-default-features --all-targets -- -D warnings

  rust-tests:
    name: Rust Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: workspace
            command: cargo test --workspace
          - label: core-no-default-features
            command: cargo test -p vortex-rdf-core --no-default-features
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run Rust tests
        run: ${{ matrix.command }}

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # Both js and python are members of the root workspace, so maturin and
      # wasm-pack write to <root>/target; the cache covers that default path and
      # `key` keeps each job's entry separate.
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: python
      - name: Build bindings and install environment
        working-directory: python
        run: uv sync --locked
      - name: Run tests
        working-directory: python
        run: uv run pytest tests -q

  js-tests:
    name: JS Tests
    runs-on: ubuntu-latest
    env:
      # 1. Force the compiler to use a single code generation thread (Massive memory saver)
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      # 2. Tell the compiler to prioritize binary size/memory reduction over raw execution speed
      # "s" optimizes for size; "z" optimizes for size even further
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "s"
      # 3. Limit parallel crate compilation threads so multiple dependencies don't compile at once
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: js
      # wasm-pack is a pinned npm devDependency; `npm ci` installs it and npm
      # run puts node_modules/.bin ahead of anything on PATH.
      - name: Install dependencies
        working-directory: js
        run: npm ci
      - name: Build WASM package
        working-directory: js
        run: npm run build
      # Typechecks after the build: the tsconfigs resolve against the generated
      # pkg/web/vortex_rdf.d.ts.
      - name: Run typecheck
        working-directory: js
        run: npm run typecheck
      - name: Run tests
        working-directory: js
        run: npm test
