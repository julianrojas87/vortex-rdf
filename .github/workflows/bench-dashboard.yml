name: Benchmark Dashboard

on:
  push:
    branches:
      - main
    # Skip the two cargo bench runs + full JS comparative bench on doc-only
    # pushes. Deliberately narrow: scripts/ and public/ are dashboard inputs.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        # Both targets feed one log: the render script keeps parsing across
        # concatenated divan outputs. match_lazy is the local/dashboard-only
        # lazy match matrix (never uploaded to CodSpeed).
        run: |
          cargo bench --bench benchmark | tee bench_output.txt
          cargo bench --bench match_lazy | tee -a bench_output.txt

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 25

      # Build the wasm bindings and run the JavaScript comparative benchmark
      # (VortexRdfStore variants vs rdf-stores.js vs oxigraph). Wall-clock via
      # tinybench; deliberately NOT uploaded to CodSpeed. Same full scale as a
      # local run (rdf-stores' own default: BENCH_DIM=128, 2,097,152 triples).
      - name: Build wasm + run JS comparative benchmark
        working-directory: js
        env:
          BENCH_DIM: 128
          BENCH_DIM_QUADS: 32
          MUT_BATCH: 10000
        run: |
          npm ci
          npm run build
          npm run bench

      - name: Render dashboard
        run: python3 scripts/render_bench_dashboard.py bench_output.txt public/index.html --js js/bench/results.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
