name: Benchmark Dashboard

on:
  push:
    branches:
      - main
    # Skip the two cargo bench runs + full JS comparative bench on doc-only
    # pushes. Deliberately narrow: scripts/ and public/ are dashboard inputs.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        # Both targets feed one log: the render script keeps parsing across
        # concatenated divan outputs. match_lazy is the local/dashboard-only
        # lazy match matrix (never uploaded to CodSpeed).
        #
        # BENCH_SIZE puts the Rust tab on the same 2,097,152 quads the JS and
        # Python comparative suites use (D=128), so a row means the same thing
        # on all three tabs. The suites' own default is the much smaller
        # CodSpeed size, which stays that way — instrumented runs there measure
        # instructions, where a bigger dataset only multiplies valgrind cost.
        # Repetition counts need no env: they are per-bench in the source
        # (QUERY_SAMPLES / HEAVY_SAMPLES), matching the other two suites.
        env:
          BENCH_SIZE: 2097152
        run: |
          cargo bench --bench benchmark | tee bench_output.txt
          cargo bench --bench match_lazy | tee -a bench_output.txt
          # Cross-library comparison (oxigraph, sophia, hdt). Writes its own
          # JSON rather than divan text, so it is not appended above.
          cargo bench --bench compare

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: js/package-lock.json

      # Build the wasm bindings and run the JavaScript comparative benchmark
      # (VortexRdfStore variants vs rdf-stores.js, oxigraph and hdt). Wall-clock
      # via tinybench; deliberately NOT uploaded to CodSpeed. Same full scale as
      # a local run (rdf-stores' own default: BENCH_DIM=128, 2,097,152 triples).
      # The hdt adapter opens the .hdt artifact the Rust comparative bench above
      # already built from the same dataset (target/bench_compare/hdt/data.hdt);
      # its wasm bindings are read-only, so BENCH_DIM here must keep matching
      # the Rust step's BENCH_SIZE (128³) or the hdt rows report a mismatch.
      - name: Build wasm + run JS comparative benchmark
        working-directory: js
        env:
          BENCH_DIM: 128
          BENCH_DIM_QUADS: 32
          MUT_BATCH: 10000
        run: |
          npm ci
          npm run build
          npm run build:hdt-wasm
          npm run bench

      # The Python comparative benchmark (vortex_rdf vs pyoxigraph, pycottas,
      # rdflib, lightrdf). run.py provisions one uv virtualenv per library --
      # they cannot share one, since pycottas hard-pins an older pyoxigraph
      # than the version we want to measure. Wall-clock; not uploaded to
      # CodSpeed, same as the JS comparative bench.
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build Python bindings + run Python comparative benchmark
        working-directory: python
        env:
          BENCH_DIM: 128
          BENCH_DIM_QUADS: 32
          MUT_BATCH: 10000
        run: |
          uv venv .venv --python 3.13
          uv pip install --python .venv/bin/python maturin
          # `maturin develop` requires an active virtualenv, and it is what puts
          # the compiled `_native.abi3.so` inside python/vortex_rdf/ — which is
          # all the bench needs, since run.py reaches the bindings via
          # PYTHONPATH rather than installing them into each adapter's venv.
          VIRTUAL_ENV="$PWD/.venv" .venv/bin/maturin develop --release
          python3 bench/run.py

      - name: Render dashboard
        # --bench-size is now a fallback: each bench target stamps a `#dataset`
        # line into the log with the row count and moduli it actually generated,
        # and the renderer prefers that (and warns if the two disagree). Kept so
        # a log from before the stamp still renders with the right size rather
        # than the suite's compiled-in CodSpeed default.
        run: |
          python3 scripts/render_bench_dashboard.py bench_output.txt public/index.html \
            --js js/bench/results.json \
            --python python/bench/results.json \
            --rust-compare core/bench/results.json \
            --bench-size 2097152

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
